apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oneks-application-controller.name" . }}
  namespace: oneks-system
  labels:
    {{- include "oneks-application-controller.labels" . | nindent 4 }}
data:
  APPLICATION_CLUSTER_ID: {{ required "clusterID is required" .Values.clusterID | quote }}
  APPLICATION_METRICS_ADDRESS: {{ .Values.metricsAddress | quote }}
  APPLICATION_HEALTH_ADDRESS: {{ .Values.healthAddress | quote }}
  APPLICATION_RECONCILIATION_POLL: {{ .Values.reconciliationPoll | quote }}
