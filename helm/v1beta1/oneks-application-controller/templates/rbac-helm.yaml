apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oneks-application-controller.name" . }}-helm
  namespace: kube-system
rules:
- apiGroups: ["helm.cattle.io"]
  resources: ["helmcharts"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oneks-application-controller.name" . }}
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oneks-application-controller.name" . }}-helm
subjects:
- kind: ServiceAccount
  name: {{ include "oneks-application-controller.name" . }}
  namespace: oneks-system
