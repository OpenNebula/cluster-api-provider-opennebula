image:
  repository: ghcr.io/jaimecb/cluster-api-provider-opennebula-monitor
  # Defaults to the chart appVersion (for example v0.2.0).
  tag: ""
  pullPolicy: IfNotPresent

monitor:
  endpoint: ""
  clusterID: ""
  key: ""
  authSecretName: ""
  authSecretKey: ONE_AUTH
  applicationNamespace: oneks-system
  httpTimeout: 10s
  healthAddress: ":8081"
  resourceConfigNamespace: kube-system
  resourceConfigName: capone-resource-monitor
  resourcePollInterval: 10s

resourceConfig:
  # Create an empty live configuration that cluster administrators can edit.
  create: true
  monitorYaml: ""
