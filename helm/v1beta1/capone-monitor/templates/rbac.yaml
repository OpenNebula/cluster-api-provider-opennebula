apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capone-cluster-monitor
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capone-cluster-monitor
  namespace: {{ .Values.monitor.applicationNamespace | quote }}
rules:
- apiGroups: ["oneks.opennebula.io"]
  resources: ["oneksapplications"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capone-cluster-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capone-cluster-monitor
subjects:
- kind: ServiceAccount
  name: capone-cluster-monitor
  namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capone-cluster-monitor
  namespace: {{ .Values.monitor.applicationNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capone-cluster-monitor
subjects:
- kind: ServiceAccount
  name: capone-cluster-monitor
  namespace: {{ .Release.Namespace | quote }}
