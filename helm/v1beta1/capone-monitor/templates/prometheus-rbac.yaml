{{- $namespaces := uniq .Values.monitor.prometheusNamespaces }}
{{- if gt (len $namespaces) 32 }}
{{- fail "monitor.prometheusNamespaces must contain at most 32 unique namespaces" }}
{{- end }}
{{- range $namespace := $namespaces }}
{{- if or (gt (len $namespace) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $namespace)) }}
{{- fail (printf "monitor.prometheusNamespaces contains invalid namespace %q" $namespace) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capone-cluster-monitor-prometheus
  namespace: {{ $namespace | quote }}
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capone-cluster-monitor-prometheus
  namespace: {{ $namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capone-cluster-monitor-prometheus
subjects:
- kind: ServiceAccount
  name: capone-cluster-monitor
  namespace: {{ $.Release.Namespace | quote }}
{{- end }}
