apiVersion: apps/v1
kind: Deployment
metadata:
  name: capone-cluster-monitor
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: capone-cluster-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capone-cluster-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capone-cluster-monitor
    spec:
      serviceAccountName: capone-cluster-monitor
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: monitor
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        envFrom:
        - configMapRef:
            name: capone-cluster-monitor
        - secretRef:
            name: capone-cluster-monitor
        env:
        - name: MONITOR_AUTH_FILE
          value: /var/run/secrets/oneks-monitor/ONE_AUTH
        volumeMounts:
        - name: monitor-auth
          mountPath: /var/run/secrets/oneks-monitor
          readOnly: true
        ports:
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 96Mi
      volumes:
      - name: monitor-auth
        secret:
          secretName: {{ required "monitor.authSecretName is required" .Values.monitor.authSecretName | quote }}
          items:
          - key: {{ required "monitor.authSecretKey is required" .Values.monitor.authSecretKey | quote }}
            path: ONE_AUTH
      terminationGracePeriodSeconds: 30
