apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oneks-application-controller.name" . }}
  namespace: oneks-system
rules:
- apiGroups: ["oneks.opennebula.io"]
  resources: ["oneksapplications"]
  # Create materializes shared Dependency applications, patch persists
  # application finalizers, and delete garbage-collects unreferenced shared
  # Dependency applications. CRD CEL validation keeps the spec immutable.
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
- apiGroups: ["oneks.opennebula.io"]
  resources: ["oneksapplications/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oneks-application-controller.name" . }}
  namespace: oneks-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oneks-application-controller.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "oneks-application-controller.name" . }}
  namespace: oneks-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneks-application-controller-helm
  namespace: kube-system
rules:
- apiGroups: ["helm.cattle.io"]
  resources: ["helmcharts"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oneks-application-controller.name" . }}
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oneks-application-controller-helm
subjects:
- kind: ServiceAccount
  name: {{ include "oneks-application-controller.name" . }}
  namespace: oneks-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oneks-application-controller-managed-resources
rules:
- apiGroups: [""]
  resources: ["namespaces", "configmaps"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: ["helm.cattle.io"]
  resources: ["helmchartconfigs"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["clusterissuers", "certificates"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: ["trust.cert-manager.io"]
  resources: ["bundles"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["secrets"]
  # Get reads readiness metadata and immutable input/target Secrets. Create,
  # update, and delete implement protected Secret lifecycle without patching.
  verbs: ["get", "create", "update", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingressclasses"]
  verbs: ["get"]
- apiGroups: ["longhorn.io"]
  resources: ["settings"]
  resourceNames: ["deleting-confirmation-flag"]
  verbs: ["get", "patch"]
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  resourceNames:
  - certificates.cert-manager.io
  - certificaterequests.cert-manager.io
  - issuers.cert-manager.io
  - clusterissuers.cert-manager.io
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["endpoints"]
  resourceNames: ["cert-manager-webhook"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oneks-application-controller-managed-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oneks-application-controller-managed-resources
subjects:
- kind: ServiceAccount
  name: {{ include "oneks-application-controller.name" . }}
  namespace: oneks-system
