            required:
            - catalogueChartID
            - clusterID
            - deletionPolicy
            - executionMode
            - planDigest
            - planVersion
            - release
            - resources
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: plan-v1alpha1 does not permit role or dependency fields and
                requires the fixed workload namespace without namespace creation
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha1' || (!has(self.role)
                && !has(self.dependencies) && !has(self.dependencyPlans) && self.release.targetNamespace
                == 'oneks-poc-workloads' && !self.release.createNamespace && self.resources.all(r,
                r.__namespace__ == 'oneks-poc-workloads'))
            - message: plan-v1alpha1 requires a non-empty HTTPS repositoryURL
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha1' || (size(self.release.repositoryURL)
                >= 1 && self.release.repositoryURL.matches('^https://[^[:space:]]+$'))
            - message: plan-v1alpha2 requires role
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha2' || has(self.role)
            - message: plan-v1alpha2 release must use either an HTTPS repositoryURL
                with a non-OCI chart or an empty repositoryURL with an OCI chart
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha2' || ((size(self.release.repositoryURL)
                == 0 && self.release.chart.matches('^oci://[^[:space:]]+$')) || (self.release.repositoryURL.matches('^https://[^[:space:]]+$')
                && !self.release.chart.startsWith('oci://')))
            - message: plan-v1alpha2 Root requires the fixed workload namespace without
                namespace creation
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha2' || self.role
                != 'Root' || (self.release.targetNamespace == 'oneks-poc-workloads'
                && !self.release.createNamespace)
            - message: plan-v1alpha2 Dependency must not contain dependencyPlans
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha2' || self.role
                != 'Dependency' || !has(self.dependencyPlans) || size(self.dependencyPlans)
                == 0
            - message: plan-v1alpha2 Dependency with createNamespace must not contain
                resources
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha2' || self.role
                != 'Dependency' || !self.release.createNamespace || size(self.resources)
                == 0
            - message: resources must use the release targetNamespace
              rule: self.resources.all(r, r.__namespace__ == self.release.targetNamespace)
            - message: dependency names must be unique
              rule: '!has(self.dependencies) || self.dependencies.all(d, self.dependencies.filter(x,
                x.name == d.name).size() == 1)'
            - message: dependency plan names must be unique
              rule: '!has(self.dependencyPlans) || self.dependencyPlans.all(p, self.dependencyPlans.filter(x,
                x.name == p.name).size() == 1)'
            - message: each direct Root dependency must resolve to exactly one matching
                dependencyPlan
              rule: self.planVersion != 'oneks.opennebula.io/plan-v1alpha2' || self.role
                != 'Root' || !has(self.dependencies) || (has(self.dependencyPlans)
                && self.dependencies.all(d, self.dependencyPlans.filter(p, p.name
                == d.name && p.catalogueChartID == d.catalogueChartID && p.planDigest
                == d.planDigest).size() == 1))
