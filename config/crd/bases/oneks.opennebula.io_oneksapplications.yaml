                  - message: release.chartID must equal catalogueChartID
                    rule: self.release.chartID == self.catalogueChartID
                  - message: dependency release must use either an HTTPS repositoryURL
                      with a non-OCI chart or an empty repositoryURL with an OCI chart
                    rule: (size(self.release.repositoryURL) == 0 && self.release.chart.matches('^oci://[^[:space:]]+$'))
                      || (self.release.repositoryURL.matches('^https://[^[:space:]]+$')
                      && !self.release.chart.startsWith('oci://'))
                  - message: resources must use the release targetNamespace
                    rule: self.resources.all(r, r.__namespace__ == self.release.targetNamespace)
                  - message: dependency plan with createNamespace must not contain
                      resources
                    rule: '!self.release.createNamespace || size(self.resources) ==
                      0'
                  - message: dependency names must be unique
                    rule: self.dependencies.all(d, self.dependencies.filter(x, x.name
                      == d.name).size() == 1)
                  - message: dependency plan must not directly reference itself
                    rule: self.dependencies.all(d, d.name != self.name)
                maxItems: 16
