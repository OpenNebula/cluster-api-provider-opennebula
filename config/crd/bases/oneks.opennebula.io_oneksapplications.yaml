                  type: object
                maxItems: 8
                type: array
                x-kubernetes-validations:
                - message: condition type, reason, or message exceeds the OneKS status
                    limit
                  rule: self.all(c, size(c.type) <= 128 && size(c.reason) <= 128 &&
                    size(c.message) <= 512)
              controllerVersion:
