---
name: Release monitor

on:
  push:
    tags: ["monitor-v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push image
        run: make docker-release-monitor "CLOSEST_TAG:=$GITHUB_REF_NAME" BUILDX_NO_DEFAULT_ATTESTATIONS=1

      - name: Generate chart
        run: make monitor-release "CLOSEST_TAG:=$GITHUB_REF_NAME"

      - name: Checkout repository (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ./gh-pages/

      - name: Deploy chart
        run: |
          cp "./_charts/$GITHUB_REF_NAME/capone-monitor-${GITHUB_REF_NAME#monitor-v}.tgz" ./gh-pages/charts/

      - name: Re-index charts
        working-directory: ./gh-pages/charts/
        run: |
          ../../bin/helm repo index ./ --url https://opennebula.github.io/cluster-api-provider-opennebula/charts/

      - name: Push gh-pages
        working-directory: ./gh-pages/charts/
        run: |
          git add ./index.yaml "./capone-monitor-${GITHUB_REF_NAME#monitor-v}.tgz"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git commit -m "$GITHUB_REF_NAME"
          git push

      - name: Create release
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --latest=false --generate-notes \
            "./_charts/$GITHUB_REF_NAME/capone-monitor-${GITHUB_REF_NAME#monitor-v}.tgz"
