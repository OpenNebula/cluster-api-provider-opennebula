apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: capone-cluster-monitor
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: capone-cluster-monitor
  policyTypes:
  - Ingress
  ingress:
  # Preserve kubelet health and readiness probes.
  - ports:
    - port: health
      protocol: TCP
  # Metrics require both an explicitly labelled namespace and scraper pod.
  - from:
    - namespaceSelector:
        matchLabels:
          monitoring.oneks.opennebula.io/metrics-access: "true"
      podSelector:
        matchLabels:
          monitoring.oneks.opennebula.io/metrics-scraper: "true"
    ports:
    - port: metrics
      protocol: TCP
