apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capone-cluster-monitor-prometheus
  namespace: monitoring
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capone-cluster-monitor-prometheus
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capone-cluster-monitor-prometheus
subjects:
- kind: ServiceAccount
  name: capone-cluster-monitor
  namespace: kube-system
