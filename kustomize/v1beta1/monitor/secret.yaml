apiVersion: v1
kind: Secret
metadata:
  name: capone-cluster-monitor
  namespace: kube-system
type: Opaque
stringData:
  # Replace this value with the token generated by OneKS.
  MONITOR_TOKEN: "replace-me"
  # Replace with the ONE_AUTH value from the CAPI Secret for raw manifests.
  MONITOR_AUTH: "replace-me"
