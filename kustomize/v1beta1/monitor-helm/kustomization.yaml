apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../monitor
patches:
- target:
    kind: Role
    name: capone-cluster-monitor-prometheus
  patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: capone-cluster-monitor-prometheus
- target:
    kind: RoleBinding
    name: capone-cluster-monitor-prometheus
  patch: |-
    $patch: delete
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: capone-cluster-monitor-prometheus
- target:
    kind: ServiceAccount
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
- target:
    kind: ConfigMap
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
    - op: replace
      path: /data/MONITOR_ENDPOINT
      value: '{{ required "monitor.endpoint is required" .Values.monitor.endpoint }}'
    - op: replace
      path: /data/MONITOR_CLUSTER_ID
      value: '{{ required "monitor.clusterID is required" .Values.monitor.clusterID }}'
    - op: replace
      path: /data/MONITOR_CHART_NAMESPACE
      value: '{{ .Values.monitor.chartNamespace }}'
    - op: replace
      path: /data/MONITOR_CHART_ANNOTATION
      value: '{{ .Values.monitor.chartAnnotation }}'
    - op: replace
      path: /data/MONITOR_HTTP_TIMEOUT
      value: '{{ .Values.monitor.httpTimeout }}'
    - op: replace
      path: /data/MONITOR_METRICS_ADDRESS
      value: '{{ if .Values.metrics.enabled }}{{ .Values.metrics.address }}{{ end }}'
    - op: replace
      path: /data/MONITOR_PROFILE_NAMESPACE
      value: '{{ .Release.Namespace }}'
    - op: replace
      path: /data/MONITOR_PROMETHEUS_NAMESPACES
      value: '{{ join "," .Values.monitor.prometheusNamespaces }}'
- target:
    kind: Secret
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
    - op: replace
      path: /stringData/MONITOR_KEY
      value: '{{ required "monitor.key is required" .Values.monitor.key }}'
- target:
    kind: Deployment
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: '{{ .Values.image.pullPolicy }}'
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
      - name: MONITOR_AUTH
        valueFrom:
          secretKeyRef:
            name: '{{ required "monitor.authSecretName is required" .Values.monitor.authSecretName }}'
            key: ONE_AUTH
- target:
    kind: Role
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Values.monitor.chartNamespace }}'
- target:
    kind: RoleBinding
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Values.monitor.chartNamespace }}'
    - op: replace
      path: /subjects/0/namespace
      value: '{{ .Release.Namespace }}'
- target:
    kind: ClusterRoleBinding
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /subjects/0/namespace
      value: '{{ .Release.Namespace }}'
- target:
    kind: Role
    name: capone-cluster-monitor-profiles
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
- target:
    kind: RoleBinding
    name: capone-cluster-monitor-profiles
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
    - op: replace
      path: /subjects/0/namespace
      value: '{{ .Release.Namespace }}'
- target:
    kind: Service
    name: capone-cluster-monitor-metrics
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
- target:
    kind: NetworkPolicy
    name: capone-cluster-monitor
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: '{{ .Release.Namespace }}'
