apiVersion: apps/v1
kind: Deployment
metadata:
  name: oneks-application-controller
  namespace: oneks-system
  labels:
    app.kubernetes.io/name: oneks-application-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oneks-application-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oneks-application-controller
    spec:
      serviceAccountName: oneks-application-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: controller
        image: application-controller:latest
        args:
        - --cluster-id=$(CLUSTER_ID)
        - --leader-elect=true
        - --metrics-bind-address=0
        - --health-probe-bind-address=:8081
        env:
        - name: CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: oneks-application-controller
              key: cluster-id
        ports:
        - name: health
          containerPort: 8081
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            cpu: 250m
            memory: 128Mi
      terminationGracePeriodSeconds: 30
